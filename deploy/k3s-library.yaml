apiVersion: v1
kind: Namespace
metadata:
  name: library
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nc-library
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nc-library
  template:
    metadata:
      labels:
        app: nc-library
    spec:
      containers:
        - name: nc-library
          image: localhost/nc-library:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nc-library
  namespace: library
spec:
  selector:
    app: nc-library
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nc-library
  namespace: library
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - slave.tail7c13f3.ts.net
      secretName: library-tls
  rules:
    - host: slave.tail7c13f3.ts.net
      http:
        paths:
          - path: /library
            pathType: Prefix
            backend:
              service:
                name: nc-library
                port:
                  number: 80