server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Canonical trailing slash for the app root.
    location = /library {
        return 301 /library/;
    }

    # SPA under /library — fall back to the app shell for client-side routes.
    location /library/ {
        try_files $uri $uri/ /library/index.html;
    }

    # Service worker must always be revalidated so updates land.
    location = /library/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA manifest needs the correct MIME type or browsers reject it.
    # default_type applies because nginx's mime.types has no .webmanifest entry.
    location = /library/manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Same-origin proxy for Nextcloud — avoids CORS on token/OCS/DAV calls.
    # PWA fetches /cloud/... here; nginx forwards to the real NC on slave.
    location /cloud/ {
        proxy_pass https://slave.tail7c13f3.ts.net/cloud/;
        proxy_http_version 1.1;
        proxy_set_header Host slave.tail7c13f3.ts.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        client_max_body_size 0;
        proxy_request_buffering off;
    }
}